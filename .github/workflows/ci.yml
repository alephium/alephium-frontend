name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Lint, typecheck and test all workspaces
        run: pnpm run check

      - name: Verify mobile dApp provider UMD artifact
        working-directory: apps/mobile-wallet
        run: node -e "require.resolve('@alephium/wallet-dapp-provider/lib/provider.umd.json')"

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Audit NPM dependencies
        run: pnpm audit --prod

  build-desktop-wallet:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: ubuntu
          - os: windows-latest
            platform: windows

    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Skip desktop wallet signing
        uses: jaywcjlove/github-action-package@6fb8b5f918c1cb2eb3e0416d5b9f45cd4af6ed16 # v2.0.0
        with:
          path: apps/desktop-wallet/package.json
          unset: build.win.sign

      - name: Building desktop wallet on ${{ matrix.platform }}
        run: cd apps/desktop-wallet && pnpm run ci:build:electron:${{ matrix.platform }}
