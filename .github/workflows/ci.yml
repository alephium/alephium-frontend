name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Lint, typecheck and test all workspaces
        run: pnpm run check

      - name: Verify mobile dApp provider UMD artifact
        working-directory: apps/mobile-wallet
        run: node -e "require.resolve('@alephium/wallet-dapp-provider/lib/provider.umd.json')"

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Audit NPM dependencies
        run: pnpm audit --prod

  build-desktop-wallet:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: build:electron:macos:ci
          - os: ubuntu-latest
            task: build:electron:ubuntu
          - os: windows-latest
            task: build:electron:windows

    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # --affected diffs against the base commit, so the history has to reach
          # it. blob:none keeps that affordable on ~300MB of history.
          fetch-depth: 0
          filter: blob:none

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Skip desktop wallet signing
        uses: jaywcjlove/github-action-package@6fb8b5f918c1cb2eb3e0416d5b9f45cd4af6ed16 # v2.0.0
        with:
          path: apps/desktop-wallet/package.json
          unset: build.win.sign

      # Must run from the repo root. From apps/desktop-wallet, --affected narrows to
      # that package's own files and reports a packages/shared change as unaffected,
      # silently skipping the build.
      - name: Building desktop wallet on ${{ matrix.os }}
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm exec turbo run ${{ matrix.task }} --affected
