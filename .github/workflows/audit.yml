name: Audit

on:
  # Off the hour: GitHub delays scheduled runs that bunch up at :00.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # Unlike the build, the audit really does depend on nothing but these two files.
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Audit NPM dependencies
        run: pnpm audit --prod
